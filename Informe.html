<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Informe de Resultados – Diseño Estructural de Losas</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #12161c; color: #222; height: 100vh; overflow-y: auto; }
    
    .toolbar { position: sticky; top: 0; z-index: 10; background: #171c23; padding: 12px 22px; display: flex; gap: 12px; align-items: center; border-bottom: 1px solid #2c3542; box-shadow: 0 4px 16px rgba(0,0,0,.4); flex-wrap: wrap; }
    .toolbar span.titulo-bar { color: #e8ecf1; font-weight: 700; font-size: 1rem; flex: 1; letter-spacing: .2px; min-width: 180px; }
    .toolbar select { background: #0f1318; color: #e8ecf1; border: 1px solid #2c3542; padding: 8px 12px; border-radius: 7px; font-size: 0.84rem; font-weight: 600; outline: none; cursor: pointer; }
    .toolbar select:focus { border-color: #e0b13a; }
    .toolbar button { background: #e0b13a; color: #1a1405; border: none; padding: 9px 18px; border-radius: 7px; font-weight: 700; font-size: .85rem; cursor: pointer; transition: .15s; }
    .toolbar button:hover { background: #f0c24d; }
    .toolbar button.sec { background: #252d38; color: #e8ecf1; border: 1px solid #2c3542; }
    .toolbar button.sec:hover { background: #323d4d; }
    #estado { color: #8b97a7; font-size: 0.82rem; }

    #informe { width: 190mm; margin: 22px auto 40px; box-shadow: 0 10px 40px rgba(0,0,0,.55); background: #fff; padding: 10mm 12mm; font-size: 9.5pt; line-height: 1.38; color: #222; }
    .portada { padding: 4mm 0 5mm; border-bottom: 3px solid #e0b13a; margin-bottom: 5mm; display: flex; justify-content: space-between; align-items: flex-end; }
    .portada h1 { font-size: 18pt; color: #171c23; text-transform: uppercase; letter-spacing: 0.3px; }
    .portada p { color: #555; margin-top: 1.5mm; font-size: 9pt; }
    .portada .meta-der { text-align: right; font-size: 8pt; color: #666; }

    h2.sec { font-size: 12pt; background: #171c23; color: #e0b13a; padding: 2mm 3.5mm; margin: 6mm 0 3mm; border-left: 3mm solid #e0b13a; text-transform: uppercase; letter-spacing: 0.3px; }
    h3.sub { font-size: 10.2pt; color: #171c23; border-bottom: 1.5px solid #cbd5e1; margin: 4.5mm 0 2mm; padding-bottom: 1mm; font-weight: 700; }
    h4 { font-size: 9.2pt; margin: 3mm 0 1.5mm; color: #333; font-weight: 700; }

    table { width: 100%; border-collapse: collapse; margin: 1.5mm 0 3mm; font-size: 8pt; page-break-inside: auto; }
    tr { page-break-inside: avoid; }
    th { background: #e8ecf1; color: #1e293b; border: 1px solid #94a3b8; padding: 1.4mm 1.8mm; text-align: center; font-weight: 700; }
    td { border: 1px solid #cbd5e1; padding: 1.2mm 1.8mm; text-align: center; color: #1e293b; }
    td:first-child { text-align: left; }
    table.kv td:first-child { background: #f8fafc; font-weight: 600; width: 42%; color: #334155; }
    table.kv td:last-child { text-align: left; font-family: Consolas, monospace; font-size: 8.2pt; }

    .ok, .tag-ok { color: #15803d; font-weight: bold; }
    .no, .tag-alert, .critico { color: #b91c1c; font-weight: bold; }
    .tag-info { color: #1d4ed8; font-weight: bold; }

    .destacado { background: #fff8e1; border: 1px solid #c9a400; border-radius: 1mm; padding: 2mm 3mm; margin: 2mm 0; font-weight: bold; font-size: 8.8pt; page-break-inside: avoid; }
    .formula { line-height: 1.65; background: #f8fafc; border: 1px solid #e2e8f0; border-left: 3px solid #e0b13a; padding: 2mm 3mm; margin: 1.8mm 0; font-family: Consolas, 'Courier New', monospace; font-size: 8pt; page-break-inside: auto; color: #1e293b; }
    .formula strong { color: #0f172a; }
    .formula .calc-name { color: #1e40af; font-weight: 700; }
    .formula .calc-ref { color: #92400e; font-weight: 700; font-size: 7.5pt; }
    .formula .highlight { color: #b45309; font-weight: 700; }

    .nota { color: #555; font-size: 8pt; margin: 1.5mm 0; font-style: italic; }
    .estado-global { padding: 2.5mm 3.5mm; border-radius: 1.5mm; font-weight: bold; margin: 2.5mm 0; font-size: 9pt; }
    .estado-global.ok { background: #e6f4e6; border: 1px solid #1a7f1a; color: #14532d; }
    .estado-global.no { background: #fdeaea; border: 1px solid #c62828; color: #7f1d1d; }

    .figura { text-align: center; page-break-inside: avoid; margin: 2mm 0 3.5mm; background: #fff; border: 1px solid #cbd5e1; padding: 2mm; border-radius: 1.5mm; }
    .figura img { max-width: 100%; max-height: 92mm; width: auto; height: auto; display: block; margin: 0 auto; }
    .figura .pie { font-size: 8pt; color: #475569; margin-top: 1.5mm; font-weight: 600; }

    .salto { page-break-before: always; }
    .keep { page-break-inside: avoid; }
    h2.sec.bloque { margin-top: 0; }
    .vacio { padding: 20mm; text-align: center; color: #666; }

    @media print {
        body { background: #fff; height: auto; overflow: visible; }
        .toolbar { display: none !important; }
        #informe { margin: 0; box-shadow: none; padding: 0; width: 100%; }
    }
</style>
</head>
<body>

<div class="toolbar">
    <span class="titulo-bar">Generador de Informe Estructural</span>
    <label for="sel-modo-informe" style="color:#cbd5e1; font-size:0.8rem; font-weight:600;">Incluir en el Informe:</label>
    <select id="sel-modo-informe" onchange="cargar()">
        <option value="AMBAS" selected>Ambas Tipologías (Losa Aligerada 1D + Losa Maciza 1D/2D)</option>
        <option value="NERVADA">Solo Losa Aligerada (Nervada 1D)</option>
        <option value="MACIZA">Solo Losa Maciza (Unidireccional 1D y Bidireccional 2D)</option>
    </select>
    <div id="estado"></div>
    <button class="sec" onclick="cargar()">Actualizar Vista</button>
    <button onclick="generarPDF()">Descargar PDF</button>
</div>

<div id="informe"></div>

<script>
function leer(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
function fmt(x, d = 2) { return (x === null || x === undefined || !isFinite(x)) ? '—' : Number(x).toFixed(d); }
function esc(s) { return String(s === undefined || s === null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
const KV = rows => `<table class="kv"><tbody>${rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</tbody></table>`;
const TB = (heads, rows) => `<table><thead><tr>${heads.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;

function calcularBeta1Normativo(fc) {
    if (fc <= 28) return { valor: 0.85, texto: `0.85 (Constante para 17 MPa ≤ f'c ≤ 28 MPa)` };
    if (fc < 55) {
        const v = 0.85 - (0.05 * (fc - 28)) / 7;
        return { valor: v, texto: `${v.toFixed(3)} [Ec: 0.85 - 0.05(${fc} - 28)/7]` };
    }
    return { valor: 0.65, texto: `0.65 (Mínimo normativo para f'c ≥ 55 MPa)` };
}

// ============================================================================
// 1. CAPTURA ENCUADRADA AUTOMÁTICA DE LAS LOSAS Y APOYOS DEFINIDOS
// ============================================================================
function dibujarEstructuraEncuadrada(est, losasGuardadas) {
    const W = 1400, H = 680;
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const g = c.getContext('2d');

    g.fillStyle = '#ffffff';
    g.fillRect(0, 0, W, H);

    // Recopilar nodos y líneas/vigas desde estructura_completa o desde losas
    let nodos = (est && Array.isArray(est.nodos)) ? est.nodos : [];
    let lineas = (est && Array.isArray(est.lineas)) ? est.lineas : ((est && Array.isArray(est.vigas)) ? est.vigas : []);
    let losas = (est && Array.isArray(est.losas) && est.losas.length) ? est.losas : (losasGuardadas || []);

    // Si no había array de nodos directo, reconstruirlo desde las losas/líneas
    const mapaNodos = {};
    nodos.forEach(n => { if (n && n.id !== undefined) mapaNodos[n.id] = n; });
    lineas.forEach(l => {
        if (l.n1 && typeof l.n1 === 'object' && l.n1.x !== undefined) mapaNodos[l.n1.id || `${l.n1.x}_${l.n1.y}`] = l.n1;
        if (l.n2 && typeof l.n2 === 'object' && l.n2.x !== undefined) mapaNodos[l.n2.id || `${l.n2.x}_${l.n2.y}`] = l.n2;
    });
    losas.forEach(ls => {
        ['n1', 'n2', 'n3', 'n4'].forEach(k => {
            if (ls[k] && typeof ls[k] === 'object' && ls[k].x !== undefined) {
                mapaNodos[ls[k].id || `${ls[k].x}_${ls[k].y}`] = ls[k];
            }
        });
        if (Array.isArray(ls.nodos)) {
            ls.nodos.forEach(nd => {
                if (nd && nd.x !== undefined) mapaNodos[nd.id || `${nd.x}_${nd.y}`] = nd;
            });
        }
    });

    const listaNodos = Object.values(mapaNodos);
    if (listaNodos.length === 0 && losas.length === 0) return null;

    // Si solo existen losas con dimensiones L_largo / L_corto sin coordenadas X,Y, crear encuadre esquemático
    if (listaNodos.length === 0 && losas.length > 0) {
        let curX = 0;
        losas.forEach((ls, idx) => {
            const lx = parseFloat(ls.L_largo) || 4.0;
            const ly = ls.es2D ? (parseFloat(ls.L_corto) || 3.0) : 0;
            const nA = { id: `N${idx*2+1}`, label: `N${idx*2+1}`, x: curX, y: 0, apoyo: 1 };
            const nB = { id: `N${idx*2+2}`, label: `N${idx*2+2}`, x: curX + lx, y: 0, apoyo: 1 };
            listaNodos.push(nA, nB);
            if (ls.es2D) {
                const nC = { id: `N${idx*2+3}`, label: `N${idx*2+3}`, x: curX + lx, y: ly, apoyo: 1 };
                const nD = { id: `N${idx*2+4}`, label: `N${idx*2+4}`, x: curX, y: ly, apoyo: 1 };
                listaNodos.push(nC, nD);
                ls._poly = [nA, nB, nC, nD];
            } else {
                ls._seg = [nA, nB];
            }
            curX += lx + 1.0;
        });
    }

    // Calcular Bounding Box exacto para encuadrar todas las losas definidas
    const xs = listaNodos.map(n => Number(n.x) || 0);
    const ys = listaNodos.map(n => Number(n.y) || 0);
    const minX = Math.min(...xs), maxX = Math.max(...xs);
    const minY = Math.min(...ys), maxY = Math.max(...ys);

    const spanX = Math.max(maxX - minX, 1.5);
    const spanY = Math.max(maxY - minY, 1.5);
    const padPx = 95;

    const escala = Math.min((W - 2 * padPx) / spanX, (H - 2 * padPx) / spanY, 180);
    const cx = (minX + maxX) / 2;
    const cy = (minY + maxY) / 2;

    const P = (x, y) => ({
        x: W / 2 + (x - cx) * escala,
        y: H / 2 - (y - cy) * escala
    });

    // 1. Grilla métrica de fondo encuadrada
    g.strokeStyle = '#f1f5f9';
    g.lineWidth = 1;
    const stepGrid = spanX > 15 ? 2 : 1;
    for (let x = Math.floor(minX - 2); x <= Math.ceil(maxX + 2); x += stepGrid) {
        const px = P(x, 0).x;
        if (px >= 15 && px <= W - 15) {
            g.beginPath(); g.moveTo(px, 15); g.lineTo(px, H - 15); g.stroke();
        }
    }
    for (let y = Math.floor(minY - 2); y <= Math.ceil(maxY + 2); y += stepGrid) {
        const py = P(0, y).y;
        if (py >= 15 && py <= H - 15) {
            g.beginPath(); g.moveTo(15, py); g.lineTo(W - 15, py); g.stroke();
        }
    }

    // Marco exterior de encuadre técnico
    g.strokeStyle = '#cbd5e1';
    g.lineWidth = 2;
    g.strokeRect(12, 12, W - 24, H - 24);

    const obtenerCoordNodo = (ref) => {
        if (!ref) return null;
        if (typeof ref === 'object' && ref.x !== undefined) return ref;
        return mapaNodos[ref] || null;
    };

    // 2. Dibujar Polígonos de Losas 2D y Tramos de Losas 1D
    losas.forEach((ls, idx) => {
        const label = ls.label || `L${idx + 1}`;
        const lLargo = parseFloat(ls.L_largo) || 0;
        const lCorto = parseFloat(ls.L_corto) || lLargo;
        const beta = ls.es2D ? (lLargo / Math.max(0.1, lCorto)) : 99;
        const esBidir = ls.es2D && beta < 2.0;

        // Intentar obtener los 4 vértices del paño 2D
        let pts = [];
        if (ls._poly) pts = ls._poly;
        else if (Array.isArray(ls.nodos) && ls.nodos.length >= 3) pts = ls.nodos.map(obtenerCoordNodo).filter(Boolean);
        else if (ls.n1 && ls.n2 && ls.n3 && ls.n4) {
            pts = [obtenerCoordNodo(ls.n1), obtenerCoordNodo(ls.n2), obtenerCoordNodo(ls.n3), obtenerCoordNodo(ls.n4)].filter(Boolean);
        } else if (ls.es2D && ls.n1 && ls.n2) {
            const pA = obtenerCoordNodo(ls.n1), pB = obtenerCoordNodo(ls.n2);
            if (pA && pB && Math.abs(pA.x - pB.x) > 0.01 && Math.abs(pA.y - pB.y) > 0.01) {
                pts = [
                    { x: pA.x, y: pA.y },
                    { x: pB.x, y: pA.y },
                    { x: pB.x, y: pB.y },
                    { x: pA.x, y: pB.y }
                ];
            }
        }

        if (pts.length >= 3) {
            const canvasPts = pts.map(pt => P(pt.x, pt.y));
            g.beginPath();
            g.moveTo(canvasPts[0].x, canvasPts[0].y);
            for (let k = 1; k < canvasPts.length; k++) g.lineTo(canvasPts[k].x, canvasPts[k].y);
            g.closePath();

            g.fillStyle = esBidir ? 'rgba(59, 130, 246, 0.14)' : 'rgba(224, 177, 58, 0.16)';
            g.fill();
            g.strokeStyle = esBidir ? '#2563eb' : '#d97706';
            g.lineWidth = 3;
            g.stroke();

            // Centro del paño para etiqueta encuadrada
            const midX = canvasPts.reduce((acc, p) => acc + p.x, 0) / canvasPts.length;
            const midY = canvasPts.reduce((acc, p) => acc + p.y, 0) / canvasPts.length;

            // Caja blanca semitransparente para legibilidad
            g.fillStyle = 'rgba(255, 255, 255, 0.90)';
            g.fillRect(midX - 88, midY - 30, 176, 60);
            g.strokeStyle = esBidir ? '#2563eb' : '#d97706';
            g.lineWidth = 1.5;
            g.strokeRect(midX - 88, midY - 30, 176, 60);

            g.fillStyle = '#0f172a';
            g.font = 'bold 21px Segoe UI, sans-serif';
            g.textAlign = 'center';
            g.fillText(`${label} (${esBidir ? '2D' : '1D'})`, midX, midY - 5);

            g.fillStyle = '#334155';
            g.font = '600 15px Consolas, monospace';
            g.fillText(`${lLargo.toFixed(2)}m × ${lCorto.toFixed(2)}m (β=${beta.toFixed(2)})`, midX, midY + 18);
        } else {
            // Tramo 1D entre dos nodos
            const a = obtenerCoordNodo(ls.n1) || (ls._seg && ls._seg[0]);
            const b = obtenerCoordNodo(ls.n2) || (ls._seg && ls._seg[1]);
            if (a && b) {
                const p1 = P(a.x, a.y), p2 = P(b.x, b.y);
                g.strokeStyle = '#d97706';
                g.lineWidth = 10;
                g.lineCap = 'round';
                g.beginPath(); g.moveTo(p1.x, p1.y); g.lineTo(p2.x, p2.y); g.stroke();

                const mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2;
                g.fillStyle = 'rgba(255,255,255,0.92)';
                g.fillRect(mx - 65, my - 42, 130, 34);
                g.strokeStyle = '#d97706';
                g.lineWidth = 1.5;
                g.strokeRect(mx - 65, my - 42, 130, 34);

                g.fillStyle = '#b45309';
                g.font = 'bold 19px Segoe UI, sans-serif';
                g.textAlign = 'center';
                g.fillText(`${label}: ${lLargo.toFixed(2)} m`, mx, my - 19);
            }
        }
    });

    // 3. Dibujar Vigas / Líneas conectoras
    lineas.forEach(v => {
        const a = obtenerCoordNodo(v.n1), b = obtenerCoordNodo(v.n2);
        if (!a || !b) return;
        const p1 = P(a.x, a.y), p2 = P(b.x, b.y);
        g.strokeStyle = '#1e293b';
        g.lineWidth = 5;
        g.lineCap = 'round';
        g.beginPath(); g.moveTo(p1.x, p1.y); g.lineTo(p2.x, p2.y); g.stroke();

        const L = Math.hypot(b.x - a.x, b.y - a.y);
        const mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2;
        if (v.label) {
            g.fillStyle = '#475569';
            g.font = 'bold 16px Segoe UI, sans-serif';
            g.textAlign = 'center';
            g.fillText(`${v.label} (${L.toFixed(2)}m)`, mx, my + 24);
        }
    });

    // 4. Dibujar Nodos y Simbología de Apoyos
    listaNodos.forEach((n, idx) => {
        const p = P(n.x, n.y);
        const tipoApoyo = n.apoyo !== undefined ? n.apoyo : 1;

        g.save();
        g.translate(p.x, p.y);
        g.strokeStyle = '#dc2626';
        g.lineWidth = 3;
        g.beginPath();
        if (tipoApoyo === 1) {
            g.arc(0, 20, 9, 0, Math.PI * 2); g.stroke();
            g.beginPath(); g.moveTo(-16, 31); g.lineTo(16, 31); g.stroke();
        } else if (tipoApoyo === 2) {
            g.moveTo(0, 9); g.lineTo(-16, 32); g.lineTo(16, 32); g.closePath(); g.stroke();
        } else if (tipoApoyo === 3) {
            g.moveTo(0, 8); g.lineTo(0, 20); g.moveTo(-20, 20); g.lineTo(20, 20);
            for (let k = -20; k <= 10; k += 10) { g.moveTo(k + 8, 20); g.lineTo(k, 30); }
            g.stroke();
        }
        g.restore();

        g.fillStyle = '#dc2626';
        g.beginPath(); g.arc(p.x, p.y, 8, 0, Math.PI * 2); g.fill();
        g.strokeStyle = '#ffffff';
        g.lineWidth = 2;
        g.stroke();

        const lblNodo = n.label || `N${n.id || (idx + 1)}`;
        g.fillStyle = '#0f172a';
        g.font = 'bold 17px Segoe UI, sans-serif';
        g.textAlign = 'center';
        g.fillText(lblNodo, p.x, p.y - 15);
    });

    return c.toDataURL('image/png');
}

// ============================================================================
// 2. TABLA DE DEFINICIONES GENERALES DEL SISTEMA (INCLUYE Ec, Es Y BETA1)
// ============================================================================
function renderSeccionDefiniciones(def) {
    const fc = def.fc || (def.fcPa ? def.fcPa / 1e6 : 28);
    const fy = def.fy || (def.fyPa ? def.fyPa / 1e6 : 420);
    const Ec = def.Ec || (def.EcPa ? def.EcPa / 1e6 : 4700 * Math.sqrt(fc));
    const EcFormula = def.EcFormula || "4700*raiz(f'c)";
    const Es = def.Es || (def.EPa ? def.EPa / 1e6 : 200000);
    const infoBeta1 = calcularBeta1Normativo(fc);

    let h = '<h3 class="sub">2.1 Definiciones geométricas y generales</h3>' + KV([
        ['Recubrimiento libre especificado (r)', `${esc(def.recubrimientoTipo || 'Losas interiores')} — Adoptado: ${fmt(def.rec || def.recubrimientoMm || 20, 1)} mm`],
        ['Ancho de apoyos / vigas perimetrales (Sw)', `${fmt(def.anchoApoyoMm || (def.Sw * 1000) || 300, 1)} mm (${fmt(def.Sw || def.anchoApoyoM || 0.30, 2)} m)`],
        ['Configuración de simetría de losas', def.losasIguales ? 'Todas las losas comparten parámetros geométricos globales' : 'Parámetros geométricos personalizados por cada losa']
    ]);

    h += '<h3 class="sub">2.2 Propiedades mecánicas de los materiales (Generales)</h3>' + KV([
        ['Esfuerzo de fluencia del acero (fy)', `${fmt(fy, 2)} MPa (${esc(def.fyTexto || (fy + ' MPa'))})`],
        ['Resistencia especificada del concreto (f’c)', `${fmt(fc, 2)} MPa (${esc(def.fcTexto || (fc + ' MPa'))})`],
        ['Factor bloque de compresión (β1 — NSR-10 C.10.2.7.3)', esc(infoBeta1.texto)],
        ['Módulo de elasticidad del concreto (Ec — NSR-10 C.8.5.1)', `Fórmula: ${esc(EcFormula)} = ${fmt(Ec, 2)} MPa`],
        ['Módulo de elasticidad del acero (Es — NSR-10 C.8.5.2)', `${fmt(Es, 0)} MPa (${fmt(Es / 1000, 1)} GPa)`],
        ['Relación modular elástica (n = Es / Ec)', `n = ${fmt(Es, 0)} / ${fmt(Ec, 2)} = ${fmt(Es / Ec, 2)}`]
    ]);

    h += '<h3 class="sub">2.3 Combinación de carga y avalúo de cargas asignadas</h3>' + KV([
        ['Combinación de mayoración (NSR-10 B.2.4.2)', esc(def.combinacion || '1.2D+1.6L')],
        ['Incluir peso propio estructural (Dpp, γc = 24 kN/m³)', def.pesoPropio ? 'SÍ' : 'NO']
    ]);

    const muertas = def.muertas || [];
    h += '<div class="keep"><h4>Cargas muertas sobreimpuestas por uso (NSR-10 Tabla B.3.4.3-1)</h4>' + (
        muertas.length
            ? TB(['Uso General', 'Ocupación Específica', 'Particiones Wpa (kN/m²)', 'Afinado Wcu (kN/m²)', 'Total Dsup (kN/m²)', 'Asignada a'],
                muertas.map(m => [esc(m.uso), esc(m.especifico), fmt(m.wpa), fmt(m.wcu), fmt((m.wpa || 0) + (m.wcu || 0)), esc(m.losa || 'Todas')]))
            : '<p class="nota">No se definieron cargas muertas sobreimpuestas por uso.</p>'
    ) + '</div>';

    const vivas = def.vivas || [];
    h += '<div class="keep"><h4>Cargas vivas nominales de servicio (NSR-10 Tabla B.4.2.1-1)</h4>' + (
        vivas.length
            ? TB(['Descripción / Ocupación', 'Carga Viva L (kN/m²)', 'Asignada a'],
                vivas.map(v => [esc(v.nombre), fmt(v.valor), esc(v.losa || 'Todas')]))
            : '<p class="nota">No se definieron cargas vivas.</p>'
    ) + '</div>';

    const extras = def.extras || [];
    if (extras.length > 0) {
        h += '<div class="keep"><h4>Cargas extras personalizadas</h4>' + TB(
            ['Nombre de Carga', 'Magnitud (kN/m²)', ' Naturaleza', 'Asignada a'],
            extras.map(e => [esc(e.nombre), fmt(e.valor), e.tipo === 'muerta' ? 'Muerta (D)' : 'Viva (L)', esc(e.losa || 'Todas')])
        ) + '</div>';
    }

    return h;
}

// ============================================================================
// 3. EXTRACCIÓN DE MEMORIAS DESDE LOS IFRAMES DE NERVADA Y MACIZA
// ============================================================================
function extraerSeccionDesdeIframe(iframeId, tipo) {
    try {
        if (!window.parent || !window.parent.document) return null;
        const ifr = window.parent.document.getElementById(iframeId);
        if (!ifr || !ifr.contentDocument || !ifr.contentWindow) return null;

        // Forzar actualización del cálculo en el iframe antes de extraer su DOM
        if (tipo === 'NERVADA' && typeof ifr.contentWindow.ejecutarMemoriaMultiple === 'function') {
            ifr.contentWindow.ejecutarMemoriaMultiple();
        } else if (tipo === 'MACIZA' && typeof ifr.contentWindow.ejecutarMemoriaMaciza === 'function') {
            ifr.contentWindow.ejecutarMemoriaMaciza();
        }

        const doc = ifr.contentDocument;
        const contCalcs = doc.getElementById('contenedor-calculos');
        if (!contCalcs || contCalcs.style.display === 'none') return null;

        let htmlOut = '';

        // Si es Maciza, extraer primero la tabla global de aplicabilidad del Método de Coeficientes 1D
        if (tipo === 'MACIZA') {
            const panelCoef1D = doc.getElementById('panel-coeficientes-1d-global');
            if (panelCoef1D && panelCoef1D.style.display !== 'none') {
                const tbCoef = doc.getElementById('contenedor-tabla-coeficientes-global')?.innerHTML || '';
                const dictCoef = doc.getElementById('txt-dictamen-coeficientes-global')?.innerHTML || '';
                htmlOut += `
                    <div class="keep">
                        <h3 class="sub">Verificación Global del Método de Coeficientes (Losas Macizas 1D — ACI 318-25 6.5)</h3>
                        ${tbCoef}
                        <div class="formula">${dictCoef}</div>
                    </div>
                `;
            }
        }

        // Extraer tabla resumen global de espesores mínimos (hmín)
        const tbResumen = doc.getElementById('contenedor-tabla-resumen')?.innerHTML || '';
        const valCrit = doc.getElementById('val-hmin-critico')?.innerText || '';
        const txtCrit = doc.getElementById('txt-hmin-critico')?.innerHTML || '';
        if (tbResumen) {
            htmlOut += `
                <div class="keep">
                    <h3 class="sub">Resumen General de Rigidez y Espesores Mínimos (h<sub>mín</sub>)</h3>
                    ${tbResumen}
                    <div class="destacado">Espesor Crítico del Sistema: ${esc(valCrit)} — ${txtCrit}</div>
                </div>
            `;
        }

        // Extraer cada Apéndice de Losa
        const accordions = doc.querySelectorAll('.losa-accordion');
        accordions.forEach((acc, idx) => {
            const tituloLosa = acc.querySelector('.losa-title')?.innerText.replace(/\s+/g, ' ').trim() || `Losa ${idx + 1}`;
            htmlOut += `<h3 class="sub">${esc(tituloLosa)}</h3>`;

            const pasos = acc.querySelectorAll('.paso-calculo');
            pasos.forEach(p => {
                if (p.style.display === 'none') return;
                const pTit = p.querySelector('.paso-titulo span')?.innerHTML || '';
                const pRef = p.querySelector('.ref-norma')?.innerHTML || '';
                const pFormula = p.querySelector('.paso-formula')?.innerHTML || '';

                // Extraer tablas intermedias dentro del paso (si existen)
                let tablasPaso = '';
                p.querySelectorAll('table').forEach(tb => {
                    tablasPaso += tb.outerHTML;
                });

                htmlOut += `
                    <div class="keep">
                        <h4>${pTit} ${pRef ? `<small style="color:#64748b; font-weight:normal;">[${pRef}]</small>` : ''}</h4>
                        ${tablasPaso}
                        ${pFormula ? `<div class="formula">${pFormula}</div>` : ''}
                    </div>
                `;
            });
        });

        return htmlOut;
    } catch (e) {
        console.warn("No se pudo extraer DOM del iframe:", e);
        return null;
    }
}

// ============================================================================
// 4. CARGA Y ENSAMBLAJE DEL INFORME COMPLETO
// ============================================================================
function cargar() {
    const est = leer('estructura_completa');
    const lucesFallback = leer('luces_estructura');
    const def = leer('proyectoLosas') || leer('definiciones_sistema');
    const cont = document.getElementById('informe');
    const modoInforme = document.getElementById('sel-modo-informe').value;

    const losasDisponibles = (est && Array.isArray(est.losas) && est.losas.length) ? est.losas : (Array.isArray(lucesFallback) ? lucesFallback : []);

    if (!def || losasDisponibles.length === 0) {
        cont.innerHTML = `
            <div class="vacio">
                <h2>No hay datos suficientes para generar el informe</h2>
                <p style="margin-top:8px;">Dibuje al menos una losa en el <strong>Entorno Gráfico</strong> y verifique los parámetros en <strong>Definiciones del Sistema</strong>.</p>
            </div>`;
        return;
    }

    const fecha = new Date();
    let h = '';

    // ===== BLOQUE 1: PORTADA + CAPTURA ENCUADRADA DE LAS LOSAS DEFINIDAS =====
    h += `
        <div class="portada">
            <div>
                <h1>Memoria de Cálculo Estructural: Sistemas de Losas</h1>
                <p>Diseño en Hormigón Armado conforme al Reglamento Colombiano NSR-10 (Títulos B y C) y ACI 318-25</p>
            </div>
            <div class="meta-der">
                <div><strong>Fecha:</strong> ${fecha.toLocaleDateString('es-CO', { year: 'numeric', month: 'long', day: 'numeric' })}</div>
                <div><strong>Hora:</strong> ${fecha.toLocaleTimeString('es-CO')}</div>
            </div>
        </div>
    `;

    h += '<h2 class="sec bloque">1. Geometría y Losas Definidas en el Entorno Gráfico</h2>';
    const imgEncuadrada = dibujarEstructuraEncuadrada(est, losasDisponibles);
    if (imgEncuadrada) {
        h += `
            <div class="figura keep">
                <img src="${imgEncuadrada}" alt="Planta estructural encuadrada">
                <div class="pie">Figura 1. Captura encuadrada automática de las losas, tramos, vigas y apoyos definidos en el proyecto.</div>
            </div>
        `;
    }

    // Tabla resumen de losas definidas en planta
    const filasLosas = losasDisponibles.map((l, idx) => {
        const L1 = parseFloat(l.L_largo) || 1.0;
        const L2 = parseFloat(l.L_corto) || L1;
        const es2D = Boolean(l.es2D);
        const beta = es2D ? (L1 / Math.max(0.1, L2)) : null;
        const clasif = es2D ? (beta < 2.0 ? 'Bidireccional (2D, β < 2.0)' : 'Unidireccional (1D, β ≥ 2.0)') : 'Tramo Unidireccional (1D)';
        return [
            `<strong>${esc(l.label || ('L' + (idx + 1)))}</strong>`,
            es2D ? 'Paño Rectangular (4 Nodos)' : 'Tramo Lineal (2 Nodos)',
            `${fmt(L1)} m`,
            es2D ? `${fmt(L2)} m` : '—',
            beta !== null ? fmt(beta, 2) : '—',
            clasif
        ];
    });

    h += '<div class="keep"><h4>1.1 Inventario de losas y paneles del sistema</h4>' +
        TB(['Identificador', 'Geometría en Planta', 'Luz Larga (L1)', 'Luz Corta (L2)', 'Relación β', 'Comportamiento en Losa Maciza'], filasLosas) +
        '</div>';

    // ===== BLOQUE 2: DEFINICIONES GENERALES DEL SISTEMA =====
    h += '<h2 class="sec bloque salto">2. Definiciones Generales del Sistema y Cargas</h2>';
    h += renderSeccionDefiniciones(def);

    // ===== BLOQUE 3: CÁLCULOS DE LOSA ALIGERADA (NERVADA 1D) =====
    let numSeccion = 3;
    if (modoInforme === 'AMBAS' || modoInforme === 'NERVADA') {
        h += `<h2 class="sec bloque salto">${numSeccion}. Memoria de Cálculo: Losa Aligerada (Nervada en Una Dirección - 1D)</h2>`;
        const htmlNervada = extraerSeccionDesdeIframe('iframe-nervada', 'NERVADA');
        if (htmlNervada) {
            h += htmlNervada;
        } else {
            h += `<p class="nota">Abra la pestaña de Losa Nervada 1D o presione "Actualizar Vista" para sincronizar los resultados detallados.</p>`;
        }
        numSeccion++;
    }

    // ===== BLOQUE 4: CÁLCULOS DE LOSA MACIZA (1D Y 2D) =====
    if (modoInforme === 'AMBAS' || modoInforme === 'MACIZA') {
        h += `<h2 class="sec bloque salto">${numSeccion}. Memoria de Cálculo: Losa Maciza (Unidireccional 1D y Bidireccional 2D)</h2>`;
        const htmlMaciza = extraerSeccionDesdeIframe('iframe-maciza', 'MACIZA');
        if (htmlMaciza) {
            h += htmlMaciza;
        } else {
            h += `<p class="nota">Abra la pestaña de Losa Maciza 1D y 2D o presione "Actualizar Vista" para sincronizar los resultados detallados.</p>`;
        }
    }

    h += `<p class="nota" style="margin-top:6mm; border-top:1px solid #cbd5e1; padding-top:2mm;">
        Informe técnico generado automáticamente conforme a las disposiciones del Reglamento Colombiano de Construcción Sismo Resistente NSR-10 (Título B y Título C) y ACI 318-25. Todos los diseños deben ser verificados y firmados por el ingeniero estructural responsable.
    </p>`;

    cont.innerHTML = h;
    document.getElementById('estado').textContent = 'Actualizado a las ' + fecha.toLocaleTimeString('es-CO');
}

function generarPDF() {
    const el = document.getElementById('informe'), est = document.getElementById('estado');
    if (typeof html2pdf === 'undefined') {
        est.textContent = 'Abriendo diálogo de impresión del navegador...';
        window.print();
        return;
    }
    est.textContent = 'Generando archivo PDF...';
    const nombre = 'Informe_Diseno_Losas_' + new Date().toISOString().slice(0, 10) + '.pdf';
    html2pdf().set({
        margin: [8, 8, 10, 8],
        filename: nombre,
        image: { type: 'jpeg', quality: 0.96 },
        html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff', scrollY: 0 },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
        pagebreak: { mode: ['css', 'legacy'], avoid: ['.keep', 'tr', 'h2', 'h3', '.figura'] }
    }).from(el).save().then(() => {
        est.textContent = 'PDF descargado: ' + nombre;
    }).catch(err => {
        est.textContent = 'Error al generar PDF: ' + err.message;
    });
}

// Escuchar cambios en localStorage o mensajes desde index.html para mantener el informe al día
window.addEventListener('storage', () => cargar());
window.addEventListener('message', (e) => {
    if (e.data && e.data.tipo === 'ACTUALIZAR_DEFINICIONES') cargar();
});

window.onload = () => {
    setTimeout(cargar, 250);
};
</script>
