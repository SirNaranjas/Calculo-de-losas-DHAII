<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Integrado de Diseño de Losas - NSR-10 / ACI 318-25</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif; }
        body { background: #0f1318; color: #e8ecf1; height: 100vh; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; }
        
        header { 
            background: #171c23; 
            padding: 0 24px; 
            border-bottom: 1px solid #2c3542; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            height: 54px; 
            box-shadow: 0 2px 14px rgba(0,0,0,.4); 
            z-index: 5; 
        }
        
        header .bloque-izq { display: flex; align-items: center; gap: 20px; }
        header .titulo { font-size: 0.95rem; font-weight: 700; color: #e8ecf1; display: flex; align-items: center; gap: 10px; letter-spacing: .2px; }
        header .titulo::before { content: ''; width: 10px; height: 22px; border-radius: 3px; background: #e0b13a; }

        nav { display: flex; gap: 4px; height: 100%; align-items: flex-end; }
        nav button { 
            background: transparent; 
            color: #8b97a7; 
            border: none; 
            border-bottom: 3px solid transparent; 
            padding: 0 16px; 
            height: 100%; 
            font-size: .88rem; 
            font-weight: 500; 
            cursor: pointer; 
            transition: .15s; 
            white-space: nowrap;
        }
        nav button:hover { color: #e8ecf1; background: rgba(255,255,255,.03); }
        nav button.activo { color: #e0b13a; border-bottom-color: #e0b13a; font-weight: 700; }
        
        .vista { display: none; flex: 1; height: calc(100vh - 54px); height: calc(100dvh - 54px); width: 100%; }
        .vista.activa { display: flex; }
        .panel-iframe { flex: 1; border: none; height: 100%; background: #0f1318; }
        .divisor { width: 6px; background: #171c23; border-left: 1px solid #2c3542; border-right: 1px solid #2c3542; cursor: ew-resize; transition: background .15s; }
        .divisor:hover { background: #e0b13a; }

        @media (max-width: 900px) {
            header { padding: 0 12px; height: 48px; }
            header .titulo { font-size: 0.85rem; }
            nav { width: 100%; overflow-x: auto; }
            nav button { padding: 0 10px; font-size: 0.8rem; }
            .vista { height: calc(100vh - 48px); height: calc(100dvh - 48px); }
            .divisor { display: none; }
            #vista-diseno .panel-iframe:first-child { width: 50% !important; }
        }
    </style>
</head>
<body>

    <header>
        <div class="bloque-izq">
            <div class="titulo">Diseño de Losas NSR-10 / ACI 318-25</div>
        </div>
        <nav>
            <button id="tab-diseno" class="activo" onclick="mostrarVista('diseno')">Entorno y Definiciones</button>
            <button id="tab-nervada" onclick="mostrarVista('nervada')">Losa Nervada 1D</button>
            <button id="tab-maciza" onclick="mostrarVista('maciza')">Losa Maciza 1D y 2D</button>
            <button id="tab-informe" onclick="mostrarVista('informe')">Informe PDF</button>
        </nav>
    </header>

    <!-- Pestaña 1: Entorno gráfico + Definiciones del Sistema -->
    <div id="vista-diseno" class="vista activa">
        <iframe id="iframe-grafico" class="panel-iframe" src="InterfazGrafico.html"></iframe>
        <div class="divisor" id="divisor"></div>
        <iframe id="iframe-sistema" class="panel-iframe" src="DefinicionesSistema.html"></iframe>
    </div>

    <!-- Pestaña 2: Módulo de Losa Nervada 1D -->
    <div id="vista-nervada" class="vista">
        <iframe id="iframe-nervada" class="panel-iframe" src="CalculosNervada.html"></iframe>
    </div>

    <!-- Pestaña 3: Módulo Unificado de Losa Maciza 1D y 2D -->
    <div id="vista-maciza" class="vista">
        <iframe id="iframe-maciza" class="panel-iframe" src="CalculosMacizas.html"></iframe>
    </div>

    <!-- Pestaña 4: Generación e Impresión del Informe PDF -->
    <div id="vista-informe" class="vista">
        <iframe id="iframe-informe" class="panel-iframe" src="Informe.html"></iframe>
    </div>

    <script>
        function mostrarVista(nombre) {
            // Alternar estado activo de contenedores y botones de navegación
            const vistas = ['diseno', 'nervada', 'maciza', 'informe'];
            vistas.forEach(v => {
                const elVista = document.getElementById('vista-' + v);
                const elTab = document.getElementById('tab-' + v);
                if (elVista) elVista.classList.toggle('activa', v === nombre);
                if (elTab) elTab.classList.toggle('activo', v === nombre);
            });

            // Disparar recarga o recálculo si se entra a una pestaña de cálculo
            if (nombre === 'nervada') {
                const iframeNervada = document.getElementById('iframe-nervada');
                if (iframeNervada && iframeNervada.contentWindow.ejecutarMemoriaMultiple) {
                    iframeNervada.contentWindow.ejecutarMemoriaMultiple();
                }
            }
            if (nombre === 'maciza') {
                const iframeMaciza = document.getElementById('iframe-maciza');
                if (iframeMaciza && iframeMaciza.contentWindow.ejecutarMemoriaMaciza) {
                    iframeMaciza.contentWindow.ejecutarMemoriaMaciza();
                }
            }
        }

        // Control de redimensionamiento del panel divisor (Split Screen para vista Entorno/Definiciones)
        (function () {
            const div = document.getElementById('divisor');
            const a = document.getElementById('iframe-grafico');
            const b = document.getElementById('iframe-sistema');
            const cont = document.getElementById('vista-diseno');
            let arrastrando = false;

            if (!div || !a || !b || !cont) return;

            div.addEventListener('mousedown', () => { 
                arrastrando = true; 
                a.style.pointerEvents = b.style.pointerEvents = 'none'; 
                document.body.style.userSelect = 'none'; 
            });

            window.addEventListener('mouseup', () => { 
                arrastrando = false; 
                a.style.pointerEvents = b.style.pointerEvents = ''; 
                document.body.style.userSelect = ''; 
            });

            window.addEventListener('mousemove', e => {
                if (!arrastrando) return;
                const w = cont.clientWidth;
                const x = Math.min(Math.max(e.clientX, 250), w - 250);
                a.style.flex = 'none'; 
                a.style.width = x + 'px'; 
                b.style.flex = '1';
                try { 
                    a.contentWindow.dispatchEvent(new Event('resize')); 
                    b.contentWindow.dispatchEvent(new Event('resize'));
                } catch (err) {}
            });
        })();
    </script>
</body>
</html>
